name: Relative-value research tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      # Research's unittest suite is intentionally separate from the
      # pytest collector fixtures (which have their own no-network CI job).
      - run: python -m unittest discover -s tests -p test_relative_value.py -v
      - run: python -m unittest discover -s tests -p test_forward_validation.py -v
      - name: Offline descriptive analysis smoke test against archived data
        run: python relative_value.py --as-of 2026-11-01 --out /tmp/perp-research-out
      - name: Verify descriptive outputs
        run: test -s /tmp/perp-research-out/METHODS.txt && test -s /tmp/perp-research-out/fixed_panel_volume_share_30d.csv
      - name: Walk-forward research smoke test on archived data
        run: python -m research.forward_validation --as-of 2026-11-01 --out /tmp/perp-forward-out
      - name: Verify walk-forward outputs and no-edge metadata
        run: |
          test -s /tmp/perp-forward-out/forward_predictions.csv
          test -s /tmp/perp-forward-out/forward_diagnostics.csv
          grep -q RESEARCH_ONLY_NO_EDGE_ESTABLISHED /tmp/perp-forward-out/forward_methodology.json
