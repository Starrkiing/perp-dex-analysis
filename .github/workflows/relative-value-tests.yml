name: Relative-value research tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Offline analysis smoke test against archived data
        run: python relative_value.py --as-of 2026-11-01 --out /tmp/perp-research-out
      - name: Verify output existence
        run: test -s /tmp/perp-research-out/METHODS.txt && test -s /tmp/perp-research-out/fixed_panel_volume_share_30d.csv
